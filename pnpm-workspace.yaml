packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  # Preserve prior `onlyBuiltDependencies: [esbuild]` behavior — these build
  # scripts were not run under pnpm v10 and aren't needed (Prisma's client is
  # generated explicitly via `pnpm db:generate`).
  '@prisma/engines': false
  '@scarf/scarf': false
  prisma: false
  vue-demi: false
  # Native bindings for eslint-import-resolver-typescript (falls back to a
  # slower JS implementation if not built).
  unrs-resolver: true
