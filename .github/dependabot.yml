version: 2
updates:
  # All npm dependencies across the pnpm workspace (root + apps/* + packages/*).
  # Dependabot discovers every workspace package from the root manifest, so a
  # single entry covers the whole monorepo. Collapsed into exactly two PRs:
  # one for minor+patch, one for major.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      minor:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"

  # GitHub Actions versions — one grouped PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
